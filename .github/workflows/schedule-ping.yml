name: Schedule Ping (8:30 PM Central)

on:
  schedule:
    # 8:30 PM America/Chicago can be UTC-5 (CDT) or UTC-6 (CST).
    - cron: "30 1 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  trigger-final:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger final report workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/final-report.yml/dispatches" \
            -d '{"ref":"main"}'
