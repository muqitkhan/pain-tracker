name: Morning Report (8:00 AM Central)

on:
  schedule:
    # 8:00 AM America/Chicago can be either UTC-5 (CDT) or UTC-6 (CST).
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  SESSION: morning

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Guard: run only at 08:00 Central
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          h="$(TZ=America/Chicago date +%H)"
          m="$(TZ=America/Chicago date +%M)"
          if [ "$h" = "08" ] && [ "$m" = "00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard: skip if required secrets missing
        id: secrets
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "Required secret GEMINI_API_KEY missing. Skipping run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true' && steps.secrets.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        if: steps.guard.outputs.run == 'true' && steps.secrets.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true' && steps.secrets.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        if: steps.guard.outputs.run == 'true' && steps.secrets.outputs.run == 'true'
        env:
          REDDIT_MODE: rss
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/scraper.py "$SESSION"

      - name: Commit & push report JSON
        if: steps.guard.outputs.run == 'true' && steps.secrets.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          LOCAL_DATE="$(TZ=America/Chicago date +%Y-%m-%d)"
          REPORT_PATH="reports/${LOCAL_DATE}-${SESSION}.json"

          git add "$REPORT_PATH"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "Add ${SESSION} report for ${LOCAL_DATE}"
          git pull --rebase
          git push
