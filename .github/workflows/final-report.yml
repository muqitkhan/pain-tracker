name: Final Daily Report (8:30 PM Central)

on:
  schedule:
    # 8:30 PM America/Chicago can be either UTC-5 (CDT) or UTC-6 (CST).
    - cron: "30 1 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Guard: run only at 20:30 Central
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          h="$(TZ=America/Chicago date +%H)"
          m="$(TZ=America/Chicago date +%M)"
          if [ "$h" = "20" ] && [ "$m" = "30" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run final report (Gemini + email)
        if: steps.guard.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python scripts/final_report.py

