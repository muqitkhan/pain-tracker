name: Final Daily Report (8:30 PM Central)

on:
  schedule:
    # 8:30 PM America/Chicago can be either UTC-5 (CDT) or UTC-6 (CST).
    - cron: "30 1 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Guard - run only at 20:30 Central
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          h="$(TZ=America/Chicago date +%H)"
          m="$(TZ=America/Chicago date +%M)"
          if [ "$h" = "20" ] && [ "$m" = "30" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Guard - skip if required secrets missing
        id: secrets
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          set -euo pipefail
          missing=0
          for key in GEMINI_API_KEY GMAIL_ADDRESS GMAIL_APP_PASSWORD RECIPIENT_EMAIL; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true' && steps.secrets.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download morning reports
        if: steps.guard.outputs.run == 'true' && steps.secrets.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import zipfile
          from io import BytesIO
          
          owner = os.environ["GITHUB_REPOSITORY"].split("/")[0]
          repo = os.environ["GITHUB_REPOSITORY"].split("/")[1]
          token = os.environ.get("GH_TOKEN", "")
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def api_get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def download_artifact(workflow_file, artifact_name):
              runs = api_get(f"https://api.github.com/repos/{owner}/{repo}/actions/workflows/{workflow_file}/runs?branch=main&status=success&per_page=1")
              if not runs.get("workflow_runs"):
                  raise SystemExit(f"No successful runs found for {workflow_file}")
              run_id = runs["workflow_runs"][0]["id"]
              artifacts = api_get(f"https://api.github.com/repos/{owner}/{repo}/actions/runs/{run_id}/artifacts")
              match = None
              for a in artifacts.get("artifacts", []):
                  if a.get("name") == artifact_name:
                      match = a
                      break
              if not match:
                  raise SystemExit(f"Artifact not found: {artifact_name}")
              # Follow redirect manually without auth header to avoid 401 on storage URL.
              req = urllib.request.Request(match["archive_download_url"], headers=headers)
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(req) as r:
                      data = r.read()
              except urllib.error.HTTPError as e:
                  if e.code in (301, 302, 303, 307, 308):
                      url = e.headers.get("Location")
                      with urllib.request.urlopen(url) as r2:
                          data = r2.read()
                  else:
                      raise
              zf = zipfile.ZipFile(BytesIO(data))
              os.makedirs("reports", exist_ok=True)
              zf.extractall("reports")
          
          download_artifact("scrape-morning.yml", "reports-morning")
          PY

      - name: Download evening reports
        if: steps.guard.outputs.run == 'true' && steps.secrets.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import zipfile
          from io import BytesIO
          
          owner = os.environ["GITHUB_REPOSITORY"].split("/")[0]
          repo = os.environ["GITHUB_REPOSITORY"].split("/")[1]
          token = os.environ.get("GH_TOKEN", "")
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          
          def api_get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          
          def download_artifact(workflow_file, artifact_name):
              runs = api_get(f"https://api.github.com/repos/{owner}/{repo}/actions/workflows/{workflow_file}/runs?branch=main&status=success&per_page=1")
              if not runs.get("workflow_runs"):
                  raise SystemExit(f"No successful runs found for {workflow_file}")
              run_id = runs["workflow_runs"][0]["id"]
              artifacts = api_get(f"https://api.github.com/repos/{owner}/{repo}/actions/runs/{run_id}/artifacts")
              match = None
              for a in artifacts.get("artifacts", []):
                  if a.get("name") == artifact_name:
                      match = a
                      break
              if not match:
                  raise SystemExit(f"Artifact not found: {artifact_name}")
              # Follow redirect manually without auth header to avoid 401 on storage URL.
              req = urllib.request.Request(match["archive_download_url"], headers=headers)
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(req) as r:
                      data = r.read()
              except urllib.error.HTTPError as e:
                  if e.code in (301, 302, 303, 307, 308):
                      url = e.headers.get("Location")
                      with urllib.request.urlopen(url) as r2:
                          data = r2.read()
                  else:
                      raise
              zf = zipfile.ZipFile(BytesIO(data))
              os.makedirs("reports", exist_ok=True)
              zf.extractall("reports")
          
          download_artifact("scrape-evening.yml", "reports-evening")
          PY

      - name: Setup Python
        if: steps.guard.outputs.run == 'true' && steps.secrets.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true' && steps.secrets.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run final report (Gemini + email)
        if: steps.guard.outputs.run == 'true' && steps.secrets.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python scripts/final_report.py
